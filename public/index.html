<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bybit Sizer</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .symbol a,.symbol a:visited{color:#fff;text-decoration:none}.symbol a:hover{text-decoration:underline}.workspace-tabs{display:flex;gap:7px;margin-top:12px;border-bottom:1px solid #334155}.workspace-tabs button{border-radius:6px 6px 0 0;background:#182235;color:#aeb9d0;padding:8px 11px;font-size:11px}.workspace-tabs button.active{background:#d9edf9;color:#102e49}.workspace-tabs b{margin-left:4px}.history-table{margin-top:10px;border:1px solid #334155;overflow-x:auto}.history-table table{min-width:700px}.history-table th{background:#182235}.history-table td{background:#fff;color:#111827}
    .server-controls{display:flex;flex-direction:column;align-items:flex-end;gap:5px}.server-controls-top{display:flex;align-items:center;gap:7px}.refresh-button{background:#155d45;border:1px solid #2a8263;border-radius:16px;padding:6px 10px;font-size:11px}.refresh-button:hover{background:#1b7053}.refresh-note{font-size:10px;color:#9eabc5}.account{position:relative}.account-pnl{position:absolute;left:420px;top:9px;margin:0!important;white-space:nowrap}.account-pnl select,.pnl-range input{margin:0 3px;border:1px solid #9ec7df;border-radius:4px;background:#fff;color:#102e49;font:inherit;font-weight:700;padding:1px 4px}.pnl-range{font-size:10px}.pnl-range input{width:142px}
    .trade-summary{align-items:stretch}.symbol{align-self:center}.trade-summary-data{display:flex;flex:1;justify-content:center;align-items:stretch}.full-metrics{display:flex;align-items:stretch}.full-metrics>span,.pnl-metric{display:flex;flex-direction:column;justify-content:center;min-width:78px;padding:0 10px;text-align:center}.full-metrics>span+span{border-left:1px solid #465166}.pnl-metric{box-sizing:border-box;flex:1;min-width:120px;align-items:center;padding:0 10px;text-align:center;border-left:1px solid #465166}.trade-dates{display:grid;align-content:center;align-self:stretch;gap:3px;min-width:166px;padding-left:12px;border-left:1px solid #465166;color:#9eabc5;font-size:9px;line-height:1.15}.trade-dates b{display:inline;color:#fff;font-size:10px;margin-left:4px}.trade-summary i{align-self:center}
    .trade-result{grid-template-columns:repeat(5,minmax(0,1fr))}.trade-result>div{flex-direction:column;gap:3px;padding:8px;border-right:1px solid #d4d9e1;border-bottom:0;font-size:11px}.trade-result>div:last-child{grid-column:auto;border-right:0}.trade-result b{font-size:12px}
    .trade-details{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 12px}.trade-main{grid-column:1/-1;padding:12px 0 0}.trade-details>.table-block{width:auto;max-width:none;margin:0}.trade-details>.table-block table{width:100%;min-width:0}.table-block th,.table-block td{padding:8px 13px}.trade-details>.trade-footer{grid-column:1/-1;margin:0}
    @media(max-width:680px){.server-controls{gap:4px}.account-pnl{position:static;margin:0!important}.trade-summary-data{display:block;overflow-x:auto}.full-metrics{width:max-content}.full-metrics>span{padding:0 10px}.pnl-metric{position:static;width:auto;min-width:120px;padding:0 10px}.trade-result{grid-template-columns:1fr 1fr}.trade-result>div{border-bottom:1px solid #d4d9e1}.trade-result>div:nth-child(odd){border-right:1px solid #d4d9e1}.trade-result>div:last-child{grid-column:1/-1;border-right:0;border-bottom:0}.trade-details{grid-template-columns:1fr}.trade-details>.trade-footer{grid-column:auto}}
    .grid-planner{margin-top:10px;background:#fff;color:#111827;border:1px solid #1f293c}.planner-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;background:#101827;color:#fff}.planner-head .eyebrow{margin-bottom:3px}.planner-head h2{font-size:18px}.planner-head>span{font-size:11px;color:#9eabc5}.planner-content{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:12px}.grid-form{height:max-content}.grid-form select.plan-input{appearance:auto;text-align:left}.grid-result{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d4d9e1;align-self:start}.grid-result>div{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid #d4d9e1;font-size:12px}.grid-result>div:nth-child(odd){border-right:1px solid #d4d9e1}.grid-result>div:nth-last-child(-n+2){border-bottom:0}.grid-result span{color:#58677b}@media(max-width:680px){.planner-content{grid-template-columns:1fr;padding:10px}.planner-head{align-items:flex-start}.planner-head>span{max-width:120px;text-align:right}.grid-result>div{padding:9px}}
    .chart-workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px}.chart-panel{min-width:0;border:1px solid #26354c;background:#101827;color:#fff}.chart-toolbar,.chart-tools{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #26354c;font-size:12px}.chart-toolbar{justify-content:space-between}.timeframes{display:flex;gap:4px}.timeframes button,.chart-tool{padding:5px 8px;background:#26354c;color:#c6d0e2;font-size:11px}.timeframes button.active,.chart-tool.active{background:#5d68e6;color:#fff}.chart-tools{flex-wrap:wrap;color:#9eabc5}.trade-chart{height:430px;display:grid;place-items:center;color:#9eabc5;font-size:12px}.trade-chart svg{display:block;width:100%;height:100%;cursor:crosshair}.chart-hit{pointer-events:all}@media(max-width:820px){.chart-workspace{grid-template-columns:1fr}.trade-chart{height:350px}}@media(max-width:680px){.chart-workspace{padding:10px}.trade-chart{height:300px}.chart-toolbar{align-items:flex-start;flex-direction:column}.chart-tools{gap:5px}.timeframes button,.chart-tool{padding:6px 8px}}
  </style>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">BYBIT · READ ONLY</p><h1>Сайзер сделок</h1></div><div class="server-controls"><div class="server-controls-top"><span id="mode">ДЕМО</span><button id="refresh" class="refresh-button">Обновить</button></div><span class="refresh-note">Автообновление · 5 сек</span></div></header>
    <section class="toolbar"><p id="hint">Сделки (…) </p></section>
    <section id="account" class="account" aria-label="Аккаунт"></section>
    <div id="app" aria-live="polite"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
